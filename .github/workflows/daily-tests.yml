name: Daily volatility checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_daily*.py' -v
      - run: python -m unittest discover -s tests -p 'test_minute*.py' -v
      - run: python -m unittest discover -s tests -p 'test_cv_comparison.py' -v
      - run: python -m unittest discover -s tests -p 'test_current_*_audit.py' -v
      - run: python src/audit_current_eda.py --check
